# Workflow derived from https://github.com/r-lib/actions/tree/v2/examples
on:
  push:
    branches: [main, master]
  pull_request:
  release:
    types: [published]
  workflow_dispatch:

name: R-CMD-check

permissions: read-all

jobs:
  R-CMD-check:
    name: ${{ matrix.config.os }} (R-${{ matrix.config.r }})
    runs-on: ${{ matrix.config.os }}
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest, r: release}
          - {os: windows-latest, r: release}
          - {os: ubuntu-latest, r: devel, http-user-agent: release}
          - {os: ubuntu-latest, r: release}
          - {os: ubuntu-latest, r: oldrel-1}
          - {os: ubuntu-latest, r: '4.2'}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::rcmdcheck
          needs: check

      - uses: r-lib/actions/check-r-package@v2

  provenance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::remotes

      - name: Verify pinned source archives
        run: |
          registry <- utils::read.csv(
            "data-raw/palette-registry.csv",
            stringsAsFactors = FALSE,
            na.strings = ""
          )
          sources <- unique(registry[
            !is.na(registry$source_sha256),
            c("source_url", "source_sha256")
          ])
          dir.create("source-archives")
          files <- file.path("source-archives", basename(sources$source_url))
          Map(
            utils::download.file,
            sources$source_url,
            files,
            MoreArgs = list(mode = "wb", quiet = TRUE)
          )
          writeLines(
            paste(sources$source_sha256, files, sep = "  "),
            "source-checksums.txt"
          )
        shell: Rscript {0}

      - name: Check source archive hashes
        run: sha256sum --check source-checksums.txt

      - name: Install exact palette-build dependencies
        run: |
          remotes::install_version("viridisLite", "0.4.3", upgrade = "never")
          remotes::install_version("scico", "1.5.0", upgrade = "never")
          remotes::install_version("colorspace", "2.1-3", upgrade = "never")
          remotes::install_version("farver", "2.1.2", upgrade = "never")
        shell: Rscript {0}

      - name: Snapshot generated palette database
        run: cp R/sysdata.rda "$RUNNER_TEMP/scChromatic-sysdata.rda"

      - name: Rebuild palette database
        run: source("data-raw/build-palette-db.R")
        shell: Rscript {0}

      - name: Check generated palette tables
        run: >-
          git diff --exit-code --
          data-raw/palette-registry.csv
          inst/extdata/palette-provenance.csv

      - name: Check generated palette database
        run: |
          before <- new.env(parent = emptyenv())
          after <- new.env(parent = emptyenv())
          load(file.path(Sys.getenv("RUNNER_TEMP"), "scChromatic-sysdata.rda"), envir = before)
          load("R/sysdata.rda", envir = after)
          stopifnot(identical(before$sc_palette_db, after$sc_palette_db))
        shell: Rscript {0}

  pkgdown:
    needs: [R-CMD-check, provenance]
    if: >-
      github.event_name != 'pull_request' &&
      (github.event_name == 'release' || github.ref_name == 'main' || github.ref_name == 'master')
    runs-on: ubuntu-latest
    concurrency:
      group: pkgdown-${{ github.ref }}
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, local::.
          needs: website

      - name: Build site
        run: pkgdown::build_site_github_pages(new_process = FALSE, install = FALSE)
        shell: Rscript {0}

      - name: Publish color-map schema
        run: |
          mkdir -p docs/schema
          cp inst/schema/sc-color-map.schema.json docs/schema/sc-color-map.schema.json

      - name: Deploy to GitHub Pages
        uses: JamesIves/github-pages-deploy-action@d92aa235d04922e8f08b40ce78cc5442fcfbfa2f  # v4.8.0
        with:
          clean: true
          branch: gh-pages
          folder: docs
